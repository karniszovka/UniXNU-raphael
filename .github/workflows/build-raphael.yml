name: build-raphael

# Turnkey builder for the Redmi K20 Pro / Mi 9T Pro (raphael, SM8150).
#
# raphael is the SAME SM8150 silicon as OnePlus 7 Pro (guacamole), which has
# already reached the iOS 16.7.16 userland. This workflow reuses guacamole's
# proven SM8150 kernel build and UEFI/UniXNU firmware, only swapping the device
# tree and the Apple Device Tree (ADT) profile (1080x2340 panel).
#
# Two jobs:
#   1. kernel  (macos-14): builds the SM8150 XNU 8796 kernel the SAME public way
#      guacamole does -- via dipa-studio/ios-sweet + blacktop/darwin-xnu-build
#      (MACHINE_CONFIG=SWEET). This is fully public; NO private defconfig needed.
#   2. build   (ubuntu-latest): builds the Aloha UEFI firmware volume, packs the
#      FAT payload (kernel + raphael ADT), and packs the Android boot image.
#
# Everything the build job needs that is not fetched from a public tree is in
# this repo (board.toml, scripts/, vendored patches/). The only network input
# is the public iPhone X (D22AP) IPSW, auto-extracted by scripts/get-base-d22ap.sh.
#
# Run order: enable Actions -> run "build-raphael" (it chains kernel -> build via
# the uploaded kernel artifact). Or run the two jobs in order manually.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: >
          "full" = the complete port. "bootshim_upstream" = identical, but
          BootShim.S is reverted to upstream (it then no longer stores the
          device-tree pointer at the guacamole address 0x9FF92000), which is
          how to tell whether that store is what resets raphael.
        required: false
        default: full
        type: choice
        options: [full, bootshim_upstream]
  push:
    branches: [main]
    paths:
      - board.toml
      - patches/**

permissions:
  contents: read

jobs:
  kernel:
    # XNU 8796 needs Xcode 15 (iig ABI) -> macos-14, like ios-sweet.
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      # Without MACOS_VERSION build.sh pops an interactive gum menu and dies
      # ("could not open TTY"). 13.5 == xnu-8796 == the iOS 16 generation.
      MACOS_VERSION: "13.5"
      MACHINE_CONFIG: SWEET
      KERNEL_CONFIG: DEVELOPMENT
    steps:
      - uses: actions/checkout@v4
        with:
          path: raphael

      - name: Checkout ios-sweet (XNU 8796 build scripts + sweet platform patches)
        uses: actions/checkout@v4
        with:
          repository: dipa-studio/ios-sweet
          path: ios-sweet

      - name: Fetch darwin-xnu-build at the pinned commit ios-sweet uses
        env:
          DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "https://github.com/blacktop/darwin-xnu-build" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # overlay ios-sweet's XNU patches/shims onto blacktop's patches dir
          cp ios-sweet/xnu/patches/*.patch ios-sweet/xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          # our own kernel patches (they sort after ios-sweet's 00xx series)
          cp raphael/patches/01*.patch dxb/patches/ 2>/dev/null || true
          ls dxb/patches/01*.patch
          # libfirehose_kernel is built arm64e-only; the SWEET kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          # Informational only: if the upstream build.sh changed its ARCHS line
          # the plain arm64 slice may be dropped, but do not fail the run here.
          if grep -q 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh; then
            echo "build.sh now builds a plain arm64 slice"
          else
            echo "::warning::ARCHS sed did not match; check build.sh if the kernel comes out arm64e-only"
          fi

      - name: Host dependencies
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); stub it
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build XNU 8796 (SWEET platform, arm64)
        working-directory: dxb
        env:
          MAKEFLAGS: '-k'
          MACHINE_CONFIG: SWEET
          KERNEL_CONFIG: DEVELOPMENT
        run: bash build.sh

      - name: Stage the kernel as kernel.macho
        run: |
          mkdir -p raphael/inputs/raphael
          # Accept ONLY a real 64-bit little-endian Mach-O (magic cffaedfe).
          # The build tree also contains text files named kernel.* (KPI symbol
          # export lists), and picking one of those silently produces a bogus
          # kernel.macho. Portable POSIX filter (BSD find has no -printf).
          find dxb -type f -name 'kernel*' 2>/dev/null > /tmp/cands.txt
          echo "=== all kernel* files in the build tree ==="
          while IFS= read -r f; do
            echo "  $(wc -c < "$f" | tr -d ' ') $f"
          done < /tmp/cands.txt
          K=""
          while IFS= read -r f; do
            sz=$(wc -c < "$f" | tr -d ' ')
            [ "$sz" -gt 2000000 ] || continue
            magic=$(od -An -tx1 -N4 "$f" | tr -d ' \n')
            if [ "$magic" = "cffaedfe" ]; then K="$f"; break; fi
          done < /tmp/cands.txt
          if [ -z "$K" ]; then
            echo "no Mach-O kernel found; candidates (name/size/type):" >&2
            while IFS= read -r f; do
              echo "  $(wc -c < "$f" | tr -d ' ') $(file -b "$f") $f" >&2
            done < /tmp/cands.txt
            exit 1
          fi
          echo "picked kernel: $K"
          cp "$K" raphael/inputs/raphael/kernel.macho
          ls -la raphael/inputs/raphael/kernel.macho

      # build.sh only warns when a patch does not apply, so prove our own
      # patch really landed instead of silently booting an ECM kernel.
      - name: Verify the CDC-ACM serial-log patch landed
        run: |
          echo "=== source state ==="
          SRC=dxb/xnu/bsd/dev/sweet_usb.c
          grep -n 'ud_cfg_desc\[' "$SRC" || echo "(no descriptor found)"
          grep -n 'GET_LINE_CODING' "$SRC" || echo "(no line-coding handling: patch skipped)"
          grep -n 'ud_raw_send' "$SRC" || echo "(no raw log sender: patch skipped)"
          echo "=== kernel strings ==="
          strings -a raphael/inputs/raphael/kernel.macho | grep -i 'Sweet iOS' || true
          if strings -a raphael/inputs/raphael/kernel.macho | grep -q 'Sweet iOS (USB Serial)' \
             && grep -q 'GET_LINE_CODING' "$SRC"; then
            echo "CDC-ACM serial-log patch: APPLIED"
          else
            echo "::error::the CDC-ACM patch was skipped; descriptors are still ECM"
            exit 1
          fi

      - name: Verify the panel-digest patch landed
        run: |
          SRC=dxb/xnu/bsd/dev/sweet_usb.c
          grep -n 'panel_report' "$SRC" || echo "(no panel reporter: patch skipped)"
          strings -a raphael/inputs/raphael/kernel.macho | grep -F 'SWEET PANEL' || true
          if grep -q 'panel_report' "$SRC" \
             && strings -a raphael/inputs/raphael/kernel.macho | grep -qF '=== SWEET t=%us'; then
            echo "panel-digest patch: APPLIED"
          else
            echo "::error::0103 was skipped; the phone would boot without the panel digest"
            exit 1
          fi

      - name: Verify the panel-report-state patch landed
        run: |
          SRC=dxb/xnu/bsd/dev/sweet_usb.c
          echo "=== source state ==="
          grep -n 'gui=%d' "$SRC" || echo "(no gui= field: 0111 skipped)"
          grep -n 'int muted = sweet_console_muted' "$SRC" || echo "(m= is still read after it is cleared: 0111 skipped)"
          echo "=== kernel strings ==="
          strings -a raphael/inputs/raphael/kernel.macho | grep -F 'gui=%d' || true
          # 0111 makes the report say whether the GUI took the screen.  Without
          # it the phone can reach the home screen and still look broken.
          if strings -a raphael/inputs/raphael/kernel.macho | grep -qF 'gui=%d' \
             && grep -q 'int muted = sweet_console_muted' "$SRC"; then
            echo "panel report state: APPLIED"
          else
            echo "::error::0111 was skipped; the report cannot tell whether the GUI took the screen"
            exit 1
          fi

      - name: Verify the SpringBoard-focused panel landed
        run: |
          SRC=dxb/xnu/bsd/dev/sweet_usb.c
          echo "=== rings ==="
          grep -n 'panel_sb\[\|panel_usb\[' "$SRC" || echo "(rings missing: 0104 skipped)"
          grep -n 'SWEET CS' "$SRC" || echo "(panel does not keep the SWEET CS lines: 0106 skipped)"
          echo "=== kernel strings ==="
          strings -a raphael/inputs/raphael/kernel.macho | grep -F -- '-- springboard --' || true
          strings -a raphael/inputs/raphael/kernel.macho | grep -F -- '-- fb --' || true
          if strings -a raphael/inputs/raphael/kernel.macho | grep -qF 'sb=%u/%u fb=%u' \
             && grep -q 'panel_sb\[' "$SRC"; then
            echo "springboard panel: APPLIED"
          else
            echo "::error::0104 was skipped; the panel would not isolate SpringBoard"
            exit 1
          fi

      - name: Verify the page-rejection diagnostics landed
        run: |
          echo "=== source state ==="
          grep -n 'SWEET CS:' dxb/xnu/bsd/kern/kern_cs.c || echo "(kern_cs.c: 0105 skipped)"
          grep -n 'SWEET CS:' dxb/xnu/osfmk/vm/vm_fault.c || echo "(vm_fault.c: 0105 skipped)"
          grep -n 'sweetcs_allow' dxb/xnu/bsd/kern/kern_cs.c || echo "(no override boot-arg)"
          echo "=== kernel strings ==="
          strings -a raphael/inputs/raphael/kernel.macho | grep -F 'SWEET CS: %s' || true
          if strings -a raphael/inputs/raphael/kernel.macho | grep -qF 'SWEET CS: %s off=0x%llx' \
             && strings -a raphael/inputs/raphael/kernel.macho | grep -qF 'SWEET CS: %s flags=0x%x' \
             && grep -q 'sweetcs_allow' dxb/xnu/bsd/kern/kern_cs.c; then
            echo "page-rejection diagnostics: APPLIED"
          else
            echo "::error::0105 was skipped; a rejected page would stay unexplained"
            exit 1
          fi

      - name: Verify the framebuffer/crash panel landed
        run: |
          SRC=dxb/xnu/bsd/dev/sweet_usb.c
          echo "=== source state ==="
          grep -n 'panel_fb\[' "$SRC" || echo "(no fb ring: 0107 skipped)"
          grep -n 'sweetpanel' "$SRC" || echo "(no panel switch boot-arg)"
          grep -n 'panel_fbswaps' "$SRC" || echo "(no swap counter: 0108 skipped)"
          echo "=== kernel strings ==="
          strings -a raphael/inputs/raphael/kernel.macho | grep -F -- '-- crash top --' || true
          strings -a raphael/inputs/raphael/kernel.macho | grep -F -- 'sweetpanel' || true
          if grep -q 'panel_fb\[' "$SRC" && grep -q 'sweetpanel' "$SRC" \
             && strings -a raphael/inputs/raphael/kernel.macho | grep -qF -- '-- crash top --'; then
            echo "framebuffer panel: APPLIED"
          else
            echo "::error::0107 was skipped; the panel would not show whether the GUI presents"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: raphael-kernel
          path: raphael/inputs/raphael/kernel.macho
          if-no-files-found: error

  build:
    needs: kernel
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Download the SM8150 kernel built by the kernel job
        uses: actions/download-artifact@v4
        with:
          name: raphael-kernel
          path: inputs/raphael

      - name: Checkout UniXNU driver (pinned)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: b6ae99c17194e6a18fd819d3148e69fe405e91fc
          path: unixnu
          submodules: recursive

      - name: Checkout Project Aloha UEFI (SM8150)
        uses: actions/checkout@v4
        with:
          repository: Project-Aloha/mu_aloha_platforms
          # Full 40-char SHA: a short SHA is not fetchable by `git fetch <sha>`.
          ref: 0b79812897177e9fdd1fb8cb02f05f5338322541
          path: uefi
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Host tools (EDK2 + UniXNU driver)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build uuid-dev bison flex nasm iasl gcc g++ python3-dev clang lld llvm mtools unzip zip
          # UniXNU builds the firmware with EDK II's CLANGPDB tool chain and
          # looks for clang / lld-link / llvm-lib / llvm-rc on PATH. Ubuntu
          # ships them version-suffixed under /usr/lib/llvm-*/bin, so link the
          # bare names the EDK II tools_def.txt expects.
          for t in clang lld-link llvm-lib llvm-rc; do
            if command -v "$t" >/dev/null 2>&1; then echo "have $t"; continue; fi
            cand=$(ls /usr/lib/llvm-*/bin/"$t" /usr/bin/"$t"-* 2>/dev/null | sort -V | tail -1)
            if [ -n "$cand" ]; then sudo ln -sf "$cand" "/usr/local/bin/$t"; echo "linked $t -> $cand"; else echo "MISSING $t"; fi
          done
          command -v clang lld-link llvm-lib llvm-rc
          pip install -r unixnu/requirements.txt || true

      - name: Apply the SM8150 patches (vendored in this repo)
        run: |
          # NOTE: `git -C <dir> apply` resolves the patch path relative to <dir>,
          # so the paths must walk back up to the repo-root patches/ directory.
          git -C unixnu apply ../patches/unixnu-guacamole.patch
          git -C uefi apply ../patches/aloha-guacamole.patch
          # drivers/DarwinBoot is a SUBMODULE OF UniXNU, not of the Aloha tree
          git -C unixnu/drivers/DarwinBoot apply ../../../patches/darwinboot-guacamole.patch
          if [ "${{ inputs.variant || 'full' }}" = "bootshim_upstream" ]; then
            git -C uefi checkout -- BootShim/BootShim.S
            echo "variant: BootShim.S reverted to upstream (no DTB-pointer store)"
          fi

      - name: Fetch raphael DTB (real android-raphael.dtb shipped by Aloha)
        run: bash scripts/get-raphael-dtb.sh

      - name: Fetch iPhone X (D22AP) base ADT (auto from public IPSW)
        run: bash scripts/get-base-d22ap.sh

      - name: Fetch the prebuilt BaseCrypto driver (Mu external dependency)
        run: |
          # Platforms/AndromedaPkg/Andromeda.dsc.inc unconditionally includes
          # $(SHARED_CRYPTO_PATH)/Driver/Bin/CryptoDriver.inc.dsc. Upstream gets it
          # from CryptoPkg/Binaries/BaseCryptoDriver_ext_dep.json (a web ext_dep);
          # the edk2 stuart tooling is not used here, so fetch it by hand into the
          # folder name the ext_dep would have created (<name>_extdep).
          DEST=uefi/MU_BASECORE/CryptoPkg/Binaries/edk2-basecrypto-driver-bin_extdep
          mkdir -p "$DEST"
          curl -sL -o /tmp/cryptobin.zip \
            https://github.com/microsoft/mu_crypto_release/releases/download/v1.1.3/Mu_CryptoBin_v1_1_3.zip
          unzip -q -o /tmp/cryptobin.zip -d "$DEST"
          ls -l "$DEST/Driver/Bin/CryptoDriver.inc.dsc"

      - name: Build the UEFI firmware volume (SM8150 + xiaomi-raphael device)
        env:
          # Mu's BaseTools build with -Wall -Werror and its older sources trip
          # gcc-13 warnings (e.g. EfiRom.c "assignment discards 'const'
          # qualifier"). BaseTools' header.makefile appends $(EXTRA_OPTFLAGS)
          # last to both CFLAGS and CXXFLAGS, so exporting it demotes those
          # warnings back to warnings on modern Ubuntu runners.
          EXTRA_OPTFLAGS: "-Wno-error"
        run: python3 scripts/build-firmware.py

      - name: Build the FAT payload (kernel + raphael ADT)
        run: python3 scripts/build-payload.py

      - name: Pack the Android boot image
        run: python3 scripts/build-bootimg.py

      - name: Dump build logs on failure
        if: failure()
        run: |
          echo "=== build logs ==="
          ls -la out/raphael/logs/ 2>/dev/null || echo "(no logs dir)"
          for f in out/raphael/logs/*.log; do
            [ -f "$f" ] || continue
            echo "----- $f -----"
            tail -n 60 "$f"
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: out/raphael/logs/
          if-no-files-found: ignore

      - name: Report
        run: cat out/raphael/boot/boot.json

      - uses: actions/upload-artifact@v4
        with:
          name: boot-raphael.img
          path: out/raphael/boot/boot-raphael.img
          if-no-files-found: error
